[project]
name = "ray-backend"
version = "0.1.0"
description = "Ray — personal AI assistant backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    # Pinned below the newest release: a version published days ago has not been
    # vetted, and provider SDKs are a supply-chain surface.
    "google-genai>=2.14.0,<2.15.0",
]

[dependency-groups]
# Local embeddings pull in torch (~2 GB), which Phase 3 needs and Phase 2 does not.
# Kept out of the default install so CI and cold starts stay fast:
#   uv sync --group embeddings
embeddings = [
    "sentence-transformers>=3.3.0",
]
# Local voice stack (Phase 6). Kept optional because faster-whisper/Piper pull in
# torch/onnxruntime and require downloaded model files. openWakeWord must be
# installed manually (it is not yet published with Python 3.12 wheels).
voice = [
    "faster-whisper>=1.1.0",
    "piper-tts>=1.7.0",
    "numpy>=2.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "import-linter>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# B008 flags function calls in argument defaults, which is exactly how FastAPI
# dependency injection is written.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

# Optional install (see the `embeddings` group); absent in the default environment.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true

# Optional install (see the `voice` group); absent in the default environment.
[[tool.mypy.overrides]]
module = ["faster_whisper.*", "piper.*", "openwakeword.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the engine and its connection pool are created
# once, and a per-test loop would close connections out from under them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

# Architectural boundaries from ADR-0012, enforced rather than merely documented.
[tool.importlinter]
root_package = "ray"
# Required so a contract can forbid a third-party package, not just our own.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Agents never reach the database or external services directly"
type = "forbidden"
source_modules = ["ray.agents"]
forbidden_modules = ["ray.db", "ray.integrations", "ray.services"]

[[tool.importlinter.contracts]]
name = "Only services touch the database"
type = "forbidden"
source_modules = ["ray.api", "ray.core", "ray.tools", "ray.llm"]
forbidden_modules = ["ray.db.models"]
# Reaching the database *through* a service is the intended path; what is banned
# is importing a model directly.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Vendor model SDKs stay inside ray.llm"
type = "forbidden"
source_modules = ["ray.agents", "ray.api", "ray.core", "ray.services", "ray.memory"]
forbidden_modules = ["google", "httpx"]
# Going *through* ray.llm is the whole point; what is banned is calling a vendor
# SDK or speaking HTTP to a model from outside the adapter layer (ADR-0001).
allow_indirect_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ray"]
